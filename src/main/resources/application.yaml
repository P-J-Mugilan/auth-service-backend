spring:
  application:
    name: auth-service-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-exp-ms: ${JWT_ACCESS_EXP_MS}
    refresh-exp-ms: ${JWT_REFRESH_EXP_MS}